image: node:20-bookworm

stages:
  - verify
  - release

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - node scripts/publish-release.mjs
  artifacts:
    expire_in: 1 week
    paths:
      - dist/scenario-test.umd.js
      - dist/scenario-test.esm.js
      - dist/scenario-test.cjs
      - dist/scenario-test-cli.cjs
      - dist/adapters/xlsx.cjs

static_publish:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client
    - install -d -m 700 ~/.ssh
    - install -m 600 "$SCENARIO_TEST_STATIC_SSH_KEY" ~/.ssh/id_ed25519
    - install -m 644 "$SCENARIO_TEST_STATIC_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - 'echo "$CI_COMMIT_TAG" | grep -Eq "^v[0-9]+(\.[0-9]+){2}([.-][A-Za-z0-9]+)?$"'
    - export REMOTE_ROOT="/opt/scenario-test-static/public/scenario-test"
    - export REMOTE_DIR="$REMOTE_ROOT/$CI_COMMIT_TAG"
    - export TEMP_DIR="$REMOTE_ROOT/.${CI_COMMIT_TAG}.${CI_PIPELINE_ID}"
    - ssh scenario-publisher@192.168.1.199 "set -eu; test ! -e '$REMOTE_DIR'; mkdir -p '$TEMP_DIR'"
    - scp dist/scenario-test.umd.js dist/scenario-test-cli.cjs "scenario-publisher@192.168.1.199:$TEMP_DIR/"
    - ssh scenario-publisher@192.168.1.199 "set -eu; test -s '$TEMP_DIR/scenario-test.umd.js'; test -s '$TEMP_DIR/scenario-test-cli.cjs'; mv '$TEMP_DIR' '$REMOTE_DIR'"
