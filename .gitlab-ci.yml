image: node:20-bookworm

stages:
  - verify
  - release

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - node scripts/publish-release.mjs
  artifacts:
    expire_in: 1 week
    paths:
      - dist/scenario-test.umd.js
      - dist/scenario-test.esm.js
      - dist/scenario-test.cjs
      - dist/scenario-test-cli.cjs
      - dist/adapters/xlsx.cjs
